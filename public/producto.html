<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Tech — NovaSound X1</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Encabezado: barra de utilidad, marca, buscador y navegacion (igual en las 6 paginas) -->
  <header class="site-header">
    <div class="utility-bar">
      <div class="utility-bar-inner">
        <span>Envíos a todo el país</span>
      </div>
    </div>
    <div class="header-main">
      <div class="header-main-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark">N</span>
          NOVA <span class="accent">TECH</span>
        </a>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Buscar auriculares, teclados, cargadores...">
        </div>
        <div class="header-actions">
          <a href="login.html" class="header-action">👤 Iniciar sesión</a>
          <a href="comprar.html" class="header-action cart">🛒 Carrito</a>
        </div>
      </div>
    </div>
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html">Inicio</a>
        <div class="nav-item">
          <a href="listado_box.html">Catálogo ▾</a>
          <div class="dropdown-menu">
            <a href="listado_box.html">Vista en tarjetas</a>
            <a href="listado_tabla.html">Vista en tabla</a>
          </div>
        </div>
        <a href="producto.html" class="active">Producto destacado</a>
        <a href="comprar.html">Comprar</a>
      </div>
    </nav>
  </header>

  <main class="page-shell">

    <!-- Ficha de producto: producto.html?slug=<slug>, o el destacado si no hay slug.
         app.js la completa con los datos de /api/productos.php. -->
    <p id="detalle-estado" class="catalogo-estado" role="status" aria-live="polite">Cargando producto...</p>

    <article class="product-detail" id="detalle-producto" hidden>

      <figure class="gallery">
        <img id="detalle-imagen" alt="">
      </figure>

      <div>
        <span class="badge" id="detalle-badge"></span>
        <h1 id="detalle-nombre"></h1>
        <p id="detalle-descripcion"></p>
        <div class="price" id="detalle-precio"></div>

        <table class="spec-table">
          <tbody id="detalle-specs"></tbody>
        </table>

        <a href="comprar.html" id="detalle-comprar" class="btn btn-primary btn-block">Comprar este producto</a>
      </div>

    </article>

  </main>

  <!-- Pie de pagina -->
  <footer class="site-footer">
    <span class="accent">NOVA TECH</span> · Accesorios tecnológicos para tu día a día
  </footer>

  <!-- JS del sitio: ficha de producto desde la API y buscador del header (ver app.js) -->
  <script src="js/app.js" defer></script>

</body>
</html>
